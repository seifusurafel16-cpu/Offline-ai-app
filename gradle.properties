# JVM: keep max heap modest so Gradle itself does not starve a low-RAM dev machine.
# The produced app is still built against compileSdk 34; these only affect the build host.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError

# Performance: parallel + caching + on-demand configuration
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-on-demand=true

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin code style
kotlin.code.style=official
